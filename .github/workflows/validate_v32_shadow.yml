name: Validate V3.2 shadow comparator

on:
  pull_request:
    paths:
      - 'netbet_quotes_shadow.py'
      - 'multi_book_odds_scraper.py'
      - 'v32_odds_compare.py'
      - 'test_v32_odds_compare.py'
      - 'v32_shadow_ledger.py'
      - 'test_v32_shadow_ledger.py'
      - 'v32_ledger_summary.py'
      - 'test_v32_ledger_summary.py'
      - '.github/workflows/badminton_v32_odds_compare.yml'
      - '.github/workflows/validate_v32_shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile multi_book_odds_scraper.py netbet_quotes_shadow.py v32_odds_compare.py test_v32_odds_compare.py v32_shadow_ledger.py test_v32_shadow_ledger.py v32_ledger_summary.py test_v32_ledger_summary.py
      - name: Multi-bookmaker parser self-test
        run: python multi_book_odds_scraper.py --self-test
      - name: NetBet parser self-test
        run: python netbet_quotes_shadow.py --self-test
      - name: Offline regression tests
        run: python -m unittest -v test_v32_odds_compare test_v32_shadow_ledger test_v32_ledger_summary
