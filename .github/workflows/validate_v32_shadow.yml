name: Validate V3.2 shadow comparator

on:
  pull_request:
    paths:
      - 'v32_odds_compare.py'
      - 'test_v32_odds_compare.py'
      - 'v32_shadow_ledger.py'
      - 'test_v32_shadow_ledger.py'
      - '.github/workflows/badminton_v32_odds_compare.yml'
      - '.github/workflows/validate_v32_shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile v32_odds_compare.py test_v32_odds_compare.py v32_shadow_ledger.py test_v32_shadow_ledger.py
      - name: Offline regression tests
        run: python -m unittest -v test_v32_odds_compare test_v32_shadow_ledger
