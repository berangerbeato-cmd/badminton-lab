name: Badminton V3.2 odds comparison (shadow)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Badminton multi-bookmaker odds observation (shadow)'
    types: [completed]
    branches: [main]
  push:
    paths:
      - 'multi_book_odds_scraper.py'
      - 'netbet_quotes_shadow.py'
      - 'v32_odds_compare.py'
      - 'bwf_fixture_audit.py'
      - 'bwf_sync.py'
      - 'v32_quality_gate.py'
      - 'test_v32_odds_compare.py'
      - 'v32_shadow_ledger.py'
      - 'test_v32_shadow_ledger.py'
      - 'v32_ledger_summary.py'
      - 'test_v32_ledger_summary.py'
      - '.github/workflows/badminton_v32_odds_compare.yml'
  schedule:
    - cron: '35 6,8,9 * * *'

permissions:
  contents: write

concurrency:
  group: bwf-results-sync
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Refresh repository
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts
        run: |
          python -m py_compile badminton_v3_2_daily.py multi_book_odds_scraper.py netbet_quotes_shadow.py v32_odds_compare.py v32_quality_gate.py
          python badminton_v3_2_daily.py --self-test
          python multi_book_odds_scraper.py --self-test
          python netbet_quotes_shadow.py --self-test
          python -m unittest -v test_v32_odds_compare test_v32_shadow_ledger test_v32_ledger_summary
      - name: Validate BWF incremental synchronizer
        run: |
          python -m py_compile bwf_sync.py bwf_fixture_audit.py
          python bwf_sync.py --self-test
      - name: Refresh recent BWF tournaments before V3.2
        id: bwf_refresh
        continue-on-error: true
        run: |
          python bwf_sync.py --data-dir data/bwf --max-tournaments 30 --timeout 15 --delay 1.3 --report data/model_v3_2_live/bwf_refresh_latest.json
      - name: Publish BWF refresh status
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("data/model_v3_2_live/bwf_refresh_latest.json")
          if p.exists():
              obj = json.loads(p.read_text(encoding="utf-8"))
              lines = ["### BWF source refresh", "- Status: " + ("FAILED" if obj.get("errors") else "COMPLETED"),
                       "- Tournaments refreshed: " + str(obj.get("tournaments_saved", 0)),
                       "- Errors: " + str(len(obj.get("errors", [])))]
          else:
              lines = ["### BWF source refresh", "- Status: FAILED / NO REPORT"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\\n".join(lines) + "\\n")
          PY
      - name: Audit BWF Arctic Open fixture archive
        run: python bwf_fixture_audit.py --data-dir data/bwf --tournament-id 5594 --target-day 2026-10-11 --out data/model_v3_2_live/bwf_fixture_audit.json
      - name: Recompute V3.2 before observing prices
        run: |
          python badminton_v3_2_daily.py \
            --data-dir data/bwf \
            --v1-model-dir data/model \
            --selection-dir data/model_v3_2 \
            --output data/model_v3_2_live \
            --days 7
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Observe new public odds AFTER model
        run: python multi_book_odds_scraper.py --live --out data/odds_shadow
      - name: Flashscore public match diagnostic
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/odds_shadow/flashscore_badminton/latest.json')
          if not path.exists():
              print('Flashscore: no report')
          else:
              obj = json.loads(path.read_text(encoding='utf-8'))
              audit = obj.get('flashscore_match_audit') or {}
              discovery = obj.get('flashscore_discovery') or {}
              print(json.dumps({
                  'observed_at_utc': obj.get('observed_at_utc'),
                  'index_status': obj.get('status'),
                  'match_status': audit.get('status'),
                  'match_http': audit.get('http_status'),
                  'match_finished': audit.get('match_finished'),
                  'match_doubles': audit.get('appears_doubles'),
                  'requested_odds_tab_retained': audit.get('resolved_to_requested_odds_tab'),
                  'bookmakers_visible': audit.get('contains_bookmaker_names', []),
                  'index_match_links': discovery.get('index_match_link_count'),
                  'index_match_examples': discovery.get('index_match_links', [])[:3],
                  'quotes_extracted': len(obj.get('quotes', [])),
              }, ensure_ascii=False, indent=2))
          PY
      - name: Observe new NetBet quotes AFTER model
        run: |
          python netbet_quotes_shadow.py --live \
            --out data/odds_shadow/netbet_quotes \
            --model-dir data/model
      - name: Preserve public bookmaker screenshots as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookmaker-public-screenshots-${{ github.run_id }}
          path: data/odds_shadow/visual_evidence/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Compare V3.2 with observations from this run
        run: |
          # The daily snapshot preserves the first publication; compare the fresh output.
          MODEL="data/model_v3_2_live/upcoming_latest.csv"
          test -f "$MODEL" || { echo "No current model output"; exit 1; }
          python v32_odds_compare.py \
            --model "$MODEL" \
            --odds-dir data/odds_shadow \
            --out data/odds_shadow/comparison_v3_auto
      - name: Audit quality
        run: |
          python v32_quality_gate.py \
            --input data/odds_shadow/comparison_v3_auto/latest.json \
            --out data/odds_shadow/quality_gate
      - name: Archive immutable research snapshot
        run: |
          python v32_shadow_ledger.py --run-id "${{ github.run_id }}"
      - name: Summarize shadow observation ledger
        run: python v32_ledger_summary.py
      - name: Publish research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/model_v3_2_live data/odds_shadow
          git reset -q -- data/odds_shadow/visual_evidence || true
          if ! git diff --cached --quiet; then
            git commit -m 'Observe odds after V3.2 model and audit quality'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['### V3.2 ordered model / public odds / quality', '- Research only; NO BET.']
          for title, file in [
              ('Model', 'data/model_v3_2_live/latest_report.json'),
              ('Comparison', 'data/odds_shadow/comparison_v3_auto/latest.json'),
              ('Quality', 'data/odds_shadow/quality_gate/latest.json'),
          ]:
              try:
                  obj = json.loads(Path(file).read_text(encoding='utf-8-sig'))
                  lines.append(f"- {title}: {obj.get('generated_at_utc', 'unknown')}")
                  if title == 'Quality':
                      lines.append(f"- Quality statuses: {obj.get('status_counts', {})}")
              except (OSError, ValueError, UnicodeError) as exc:
                  lines.append(f'- {title}: unavailable ({exc})')
          output = '\n'.join(lines) + '\n'
          print(output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(output)
          PY
