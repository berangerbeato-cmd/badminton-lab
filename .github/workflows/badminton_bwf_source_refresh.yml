name: Badminton BWF incremental source refresh (NO BET)

on:
  workflow_dispatch:
  push:
    paths:
      - 'bwf_sync.py'
      - '.github/workflows/badminton_bwf_source_refresh.yml'
  schedule:
    - cron: '5 5,6,8,9 * * *'

permissions:
  contents: write

concurrency:
  group: bwf-results-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Refresh repository
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate generated publication
        run: python -m unittest -v test_publish_generated
      - name: Validate BWF synchronizer
        run: |
          python -m py_compile bwf_sync.py
          python bwf_sync.py --self-test
          python -m unittest -v test_bwf_transport
      - name: Refresh BWF source and preserve diagnostic status
        id: sync
        continue-on-error: true
        run: |
          python bwf_sync.py --data-dir data/bwf --max-tournaments 30 --timeout 15 --delay 1.3 --report data/model_v3_2_live/bwf_refresh_latest.json
      - name: Capture generated outputs before publication
        id: publication_bundle
        if: always()
        run: >-
          python publish_generated.py prepare
          --bundle "${{ runner.temp }}/generated-${{ github.run_id }}-${{ github.run_attempt }}"
          --paths data/bwf data/model_v3_2_live/bwf_refresh_latest.json --exclude data/odds_shadow/visual_evidence
      - name: Preserve generated outputs independently of Git publication
        id: publication_archive
        if: always() && steps.publication_bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: generated-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generated-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish generated outputs without rebase
        if: success() && steps.publication_archive.outcome == 'success'
        run: >-
          python publish_generated.py publish
          --bundle "${{ runner.temp }}/generated-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Preserve report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwf-source-refresh-audit
          path: data/model_v3_2_live/bwf_refresh_latest.json
          if-no-files-found: warn
      - name: Enforce source freshness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/model_v3_2_live/bwf_refresh_latest.json')
          if not path.exists():
              raise SystemExit('NO BET: missing source refresh report')
          report = json.loads(path.read_text(encoding='utf-8'))
          if report.get('errors') or not report.get('tournaments_saved'):
              raise SystemExit('NO BET: source refresh incomplete')
          print('BWF source refresh successful:', report['tournaments_saved'])
          PY
