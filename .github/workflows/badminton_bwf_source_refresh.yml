name: Badminton BWF incremental source refresh (NO BET)

on:
  workflow_dispatch:
  push:
    paths:
      - 'bwf_sync.py'
      - '.github/workflows/badminton_bwf_source_refresh.yml'
  schedule:
    - cron: '5 6,8,9 * * *'

permissions:
  contents: write

concurrency:
  group: bwf-results-sync
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Refresh repository
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate BWF synchronizer
        run: |
          python -m py_compile bwf_sync.py
          python bwf_sync.py --self-test
      - name: Refresh BWF source and preserve diagnostic status
        id: sync
        continue-on-error: true
        run: |
          python bwf_sync.py --data-dir data/bwf --max-tournaments 30 --timeout 15 --delay 1.3 --report data/model_v3_2_live/bwf_refresh_latest.json
      - name: Persist BWF archive and refresh report
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/bwf data/model_v3_2_live/bwf_refresh_latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh BWF source cache and source freshness audit'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bwf-source-refresh-audit
          path: data/model_v3_2_live/bwf_refresh_latest.json
          if-no-files-found: warn
      - name: Enforce source freshness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/model_v3_2_live/bwf_refresh_latest.json')
          if not path.exists():
              raise SystemExit('NO BET: missing source refresh report')
          report = json.loads(path.read_text(encoding='utf-8'))
          if report.get('errors') or not report.get('tournaments_saved'):
              raise SystemExit('NO BET: source refresh incomplete')
          print('BWF source refresh successful:', report['tournaments_saved'])
          PY
