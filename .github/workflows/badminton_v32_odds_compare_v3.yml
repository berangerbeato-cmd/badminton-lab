name: Badminton V3.2 odds comparison (shadow)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Badminton multi-bookmaker odds observation (shadow)'
    types: [completed]
    branches: [main]
  push:
    paths:
      - 'v32_odds_compare.py'
      - 'v32_quality_gate.py'
      - '.github/workflows/badminton_v32_odds_compare.yml'
  schedule:
    - cron: '35 6,8,9 * * *'

permissions:
  contents: write

concurrency:
  group: bwf-results-sync
  cancel-in-progress: false

jobs:
  compare:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Refresh repository
        run: git pull --ff-only origin main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate scripts and model
        run: |
          python -m py_compile badminton_v3_2_daily.py v32_odds_compare.py v32_quality_gate.py
          python badminton_v3_2_daily.py --self-test
      - name: Recompute actual V3.2 predictions
        run: |
          python badminton_v3_2_daily.py \
            --data-dir data/bwf \
            --v1-model-dir data/model \
            --selection-dir data/model_v3_2 \
            --output data/model_v3_2_live \
            --days 7
      - name: Compare current V3.2 with observed odds
        run: |
          MODEL="data/model_v3_2_live/snapshots/$(date -u +%F).csv"
          if [ ! -f "$MODEL" ]; then
            echo "No current-day V3.2 snapshot; comparison skipped."
            exit 0
          fi
          python v32_odds_compare.py \
            --model "$MODEL" \
            --odds-dir data/odds_shadow \
            --out data/odds_shadow/comparison_v3_auto
      - name: Audit quality
        run: |
          if [ -f data/odds_shadow/comparison_v3_auto/latest.json ]; then
            python v32_quality_gate.py \
              --input data/odds_shadow/comparison_v3_auto/latest.json \
              --out data/odds_shadow/quality_gate
          else
            echo "No comparison file available."
          fi
      - name: Publish research outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/model_v3_2_live data/odds_shadow/comparison_v3_auto data/odds_shadow/quality_gate
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh V3.2 model and shadow odds quality'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          lines = ['### V3.2 model + odds quality', '- Research only; NO BET.']
          for title, file in [
              ('Model', 'data/model_v3_2_live/latest_report.json'),
              ('Comparison', 'data/odds_shadow/comparison_v3_auto/latest.json'),
              ('Quality', 'data/odds_shadow/quality_gate/latest.json'),
          ]:
              try:
                  obj = json.loads(Path(file).read_text(encoding='utf-8-sig'))
                  lines.append(f"- {title} generated: {obj.get('generated_at_utc', 'unknown')}")
                  if title == 'Quality':
                      lines.append(f"- Quality statuses: {obj.get('status_counts', {})}")
              except (OSError, ValueError, UnicodeError) as exc:
                  lines.append(f'- {title} unavailable: {exc}')
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(report)
          PY
