name: Badminton multi-bookmaker odds observation (shadow)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/badminton_multi_odds_shadow.yml'
      - 'odds_value_shadow.py'
  schedule:
    - cron: '12 6,8,9 * * *'   # Paris +2 in summer; UTC cron, 1 hour earlier local in winter

permissions:
  contents: write

concurrency:
  group: badminton-odds-shadow
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate multi-operator parsers and Elo comparison
        run: |
          python -m py_compile multi_book_odds_scraper.py unibet_odds_scraper.py odds_value_shadow.py
          python unibet_odds_scraper.py --self-test
          python multi_book_odds_scraper.py --self-test
          python odds_value_shadow.py --self-test
      - name: Install browser for public pages
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Read-only public prices and access diagnostics
        run: python multi_book_odds_scraper.py --live --out data/odds_shadow
      - name: Audit NetBet badminton event list (diagnostic only, no inferred quotes)
        run: |
          python - <<'PY'
          import hashlib, json, re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          from multi_book_odds_scraper import robots_check

          URL = 'https://www.netbet.fr/badminton'
          out = Path('data/odds_shadow/netbet_research')
          out.mkdir(parents=True, exist_ok=True)
          report = {
              'observed_at_utc': datetime.now(timezone.utc).isoformat(timespec='seconds'),
              'source': URL, 'operator': 'NetBet.fr',
              'status': 'NOT_RUN', 'quotes': [],
              'policy': 'PUBLIC_RESEARCH_ONLY_NO_BET_NO_INFERRED_PRICES',
              'notes': 'Absence of a public event list is not evidence of absent private or future markets.'
          }
          allowed, reason = robots_check(URL)
          report['robots_status'] = reason
          if not allowed:
              report['status'] = 'SKIPPED_ROBOTS_DENIED_OR_UNAVAILABLE'
          else:
              try:
                  with sync_playwright() as pw:
                      browser = pw.chromium.launch(headless=True)
                      try:
                          page = browser.new_page(locale='fr-FR', timezone_id='Europe/Paris')
                          response = page.goto(URL, wait_until='domcontentloaded', timeout=24000)
                          page.wait_for_timeout(2200)
                          body = page.locator('body').inner_text(timeout=12000)
                          report['http_status'] = response.status if response else None
                          report['resolved_url'] = page.url
                          report['cache_age_seconds'] = response.headers.get('age') if response else None
                          report['body_sha256'] = hashlib.sha256(body.encode()).hexdigest()
                          # Exclude generic marketing copy; keep only a short
                          # excerpt near the sporting event-list heading.
                          match = re.search(r'Pariez sur Badminton|Aucun événement', body, re.I)
                          preview = body[match.start():match.start() + 1200] if match else ''
                          stop = re.search(r'\bParier sur le badminton\b', preview, re.I)
                          if stop:
                              preview = preview[:stop.start()]
                          report['event_area_excerpt'] = preview[:1200]
                          report['explicit_no_events'] = bool(re.search(
                              r'Aucun événement (?:n.est actuellement )?disponible|Aucun événement n.est actuellement disponible',
                              preview, re.I))
                          public_links = page.locator('a[href]').evaluate_all(
                              "els => els.map(a => a.href).filter(x => x.startsWith('https://'))"
                          )
                          report['public_badminton_links'] = list(dict.fromkeys(
                              url for url in public_links
                              if urlsplit(url).netloc in ('www.netbet.fr', 'netbet.fr')
                              and '/badminton' in urlsplit(url).path
                          ))[:30]
                          if report['http_status'] != 200 or urlsplit(page.url).netloc != 'www.netbet.fr':
                              report['status'] = 'REJECT_HTTP_OR_REDIRECT'
                          elif report['explicit_no_events']:
                              report['status'] = 'NO_PUBLIC_BADMINTON_EVENTS_LISTED'
                          else:
                              report['status'] = 'EVENT_LIST_UNDETERMINED_NEEDS_PARSER_AUDIT'
                      finally:
                          browser.close()
              except Exception as exc:
                  report['status'] = 'PROBE_FAILED'
                  report['error'] = f'{type(exc).__name__}: {exc}'[:240]
          stamp = datetime.fromisoformat(report['observed_at_utc']).strftime('%Y-%m-%dT%H%M%SZ')
          artifact = out / (stamp + '.json')
          artifact.write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          (out / 'latest.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps({'source': 'NetBet.fr', 'status': report['status'],
                            'quotes': 0, 'artifact': str(artifact)}, ensure_ascii=False))
          PY
      - name: Compare public quotes with frozen Elo V1 snapshot (shadow, NO BET)
        run: python odds_value_shadow.py --live --odds-dir data/odds_shadow --model-dir data/model
      - name: Save evidence without changing model, historic predictions or T0
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/odds_shadow
          if ! git diff --cached --quiet; then
            git commit -m 'Audit public multi-bookmaker badminton H2H prices and Elo shadow value'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report observed prices, not betting recommendations
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from datetime import datetime
          from pathlib import Path
          f=Path('data/odds_shadow/latest_summary.json')
          d=json.loads(f.read_text(encoding='utf-8')) if f.exists() else {}
          v=Path('data/odds_shadow/latest_value_shadow.json')
          m=json.loads(v.read_text(encoding='utf-8')) if v.exists() else {}
          n=Path('data/odds_shadow/netbet_research/latest.json')
          netbet=json.loads(n.read_text(encoding='utf-8')) if n.exists() else {}
          try:
            stamp_delta=abs((datetime.fromisoformat(d['observed_at_utc'])-
                             datetime.fromisoformat(m['source_observed_at_utc'])).total_seconds())
          except (KeyError, TypeError, ValueError):
            stamp_delta=float('inf')
          if stamp_delta>10:
            m={}
          lines=['### Badminton odds shadow audit',
            '- No betting, login, anti-bot bypass or T0/Sheets update.',
            '- Observation timestamps are NOT bookmaker price update times.',
            f"- Online H2H candidates: {d.get('online_h2h_shadow_rows','n/a')}",
            f"- Retail FDJ candidates (NOT online): {d.get('retail_shadow_rows','n/a')}",
            f"- Elo V1 shadow matched fixtures: {m.get('matched_fixtures_count','n/a')}",
            f"- NetBet public events diagnostic: {netbet.get('status','n/a')} (zero verified quotes)",
            '- All positive-EV findings are illustrative only; NO BET.']
          for key,source in d.get('sources',{}).items():
            lines.append(f"- {key}: {source['status']} ({source['quotes']} shadow quotes)")
          if m.get('matches'):
            lines.extend(['', '| BWF match | Joueur | Cote observée | EV indicative |', '|---|---|---:|---:|'])
            for match in m['matches']:
              for side in ('side_1','side_2'):
                player=match[side]
                lines.append(f"| {match['bwf_match_id']} | {player['bwf_name']} | {player['decimal_odds']:.2f} | {player['illustrative_ev_pct']:+.2f}% |")
            lines.append('')
            lines.append('All EV values are research-only; match start and executable quote unverified, NO BET.')
          elif not m:
            lines.append('- No fresh Elo value report confirmed for this run.')
          text='\n'.join(lines)+'\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:
            out.write(text)
          PY
