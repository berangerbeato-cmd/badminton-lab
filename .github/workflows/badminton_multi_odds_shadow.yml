name: Badminton multi-bookmaker odds observation (shadow)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/badminton_multi_odds_shadow.yml'
      - 'odds_value_shadow.py'
      - 'odds_diagnostics.py'
      - 'multi_book_odds_scraper.py'
  schedule:
    - cron: '12 6,8,9 * * *'

permissions:
  contents: write

concurrency:
  group: badminton-odds-shadow
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate parsers and diagnostics
        run: |
          python -m py_compile multi_book_odds_scraper.py unibet_odds_scraper.py odds_value_shadow.py odds_diagnostics.py
          python unibet_odds_scraper.py --self-test
          python multi_book_odds_scraper.py --self-test
          python odds_value_shadow.py --self-test
      - name: Install browser for public pages
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Read-only public prices and access diagnostics
        run: python multi_book_odds_scraper.py --live --out data/odds_shadow
      - name: Diagnose missing and rejected odds
        run: python odds_diagnostics.py --dir data/odds_shadow
      - name: Audit NetBet public events (no inferred odds)
        run: |
          python - <<'PY'
          import json, re, hashlib
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          from multi_book_odds_scraper import robots_check
          url='https://www.netbet.fr/badminton'
          out=Path('data/odds_shadow/netbet_research')
          out.mkdir(parents=True, exist_ok=True)
          report={'observed_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
                  'source':url,'operator':'NetBet.fr','status':'NOT_RUN','quotes':[],
                  'policy':'PUBLIC_RESEARCH_ONLY_NO_BET_NO_INFERRED_PRICES'}
          allowed,reason=robots_check(url)
          report['robots_status']=reason
          if not allowed:
              report['status']='SKIPPED_ROBOTS_DENIED_OR_UNAVAILABLE'
          else:
              try:
                  with sync_playwright() as pw:
                      browser=pw.chromium.launch(headless=True)
                      try:
                          page=browser.new_page(locale='fr-FR',timezone_id='Europe/Paris')
                          response=page.goto(url,wait_until='domcontentloaded',timeout=24000)
                          page.wait_for_timeout(2200)
                          body=page.locator('body').inner_text(timeout=12000)
                          report['http_status']=response.status if response else None
                          report['resolved_url']=page.url
                          report['cache_age_seconds']=response.headers.get('age') if response else None
                          report['body_sha256']=hashlib.sha256(body.encode()).hexdigest()
                          match=re.search(r'Pariez sur Badminton|Aucun événement',body,re.I)
                          preview=body[match.start():match.start()+1200] if match else ''
                          stop=re.search(r'\bParier sur le badminton\b',preview,re.I)
                          if stop: preview=preview[:stop.start()]
                          report['event_area_excerpt']=preview[:1200]
                          report['explicit_no_events']=bool(re.search(r'Aucun événement (?:n.est actuellement )?disponible|Aucun événement n.est actuellement disponible',preview,re.I))
                          links=page.locator('a[href]').evaluate_all("els => els.map(a => a.href).filter(x => x.startsWith('https://'))")
                          report['public_badminton_links']=list(dict.fromkeys(link for link in links if urlsplit(link).netloc in ('www.netbet.fr','netbet.fr') and '/badminton' in urlsplit(link).path))[:30]
                          if report['http_status']!=200 or urlsplit(page.url).netloc!='www.netbet.fr':
                              report['status']='REJECT_HTTP_OR_REDIRECT'
                          elif report['explicit_no_events']:
                              report['status']='NO_PUBLIC_BADMINTON_EVENTS_LISTED'
                          else:
                              report['status']='EVENT_LIST_UNDETERMINED_NEEDS_PARSER_AUDIT'
                      finally:
                          browser.close()
              except Exception as exc:
                  report['status']='PROBE_FAILED'
                  report['error']=f'{type(exc).__name__}: {exc}'[:240]
          stamp=datetime.fromisoformat(report['observed_at_utc']).strftime('%Y-%m-%dT%H%M%SZ')
          (out/(stamp+'.json')).write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          (out/'latest.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'operator':'NetBet.fr','status':report['status'],'quotes':0},ensure_ascii=False))
          PY
      - name: Compare quotes with frozen Elo V1 snapshot (shadow, NO BET)
        run: python odds_value_shadow.py --live --odds-dir data/odds_shadow --model-dir data/model
      - name: Save audit evidence
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/odds_shadow
          if ! git diff --cached --quiet; then
            git commit -m 'Audit public badminton quotes and rejection diagnostics'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report odds observation and diagnostics
        if: always()
        run: |
          python - <<'PY'
          import csv, json, os
          from pathlib import Path
          root = Path('data/odds_shadow')
          warnings = []
          def safe_json(path):
              if not path.exists():
                  warnings.append(f'Missing: {path}')
                  return {}
              try:
                  value = json.loads(path.read_text(encoding='utf-8-sig'))
                  if not isinstance(value, dict):
                      raise ValueError('Expected a JSON object')
                  return value
              except (OSError, ValueError, UnicodeError) as exc:
                  warnings.append(f'Cannot read {path}: {type(exc).__name__}: {exc}')
                  return {}
          data = safe_json(root / 'latest_summary.json')
          diagnostic = safe_json(root / 'quote_diagnostics_summary.json')
          csvfile = root / 'quote_diagnostics.csv'
          try:
              with csvfile.open(encoding='utf-8-sig', newline='') as handle:
                  rows = list(csv.DictReader(handle))
          except (OSError, UnicodeError, csv.Error) as exc:
              rows = []
              warnings.append(f'Cannot read {csvfile}: {exc}')
          lines = ['### Badminton odds shadow audit',
                   '- Shadow only: no bets placed, no executable odds confirmed.',
                   f"- Online H2H candidates: {data.get('online_h2h_shadow_rows', 'n/a')}",
                   f"- FDJ retail candidates: {data.get('retail_shadow_rows', 'n/a')}",
                   f"- Diagnostic rows: {diagnostic.get('total_rows', len(rows))}",
                   '- Details: `data/odds_shadow/quote_diagnostics.csv`.']
          for key, source in data.get('sources', {}).items():
              if isinstance(source, dict):
                  lines.append(f"- {key}: {source.get('status', 'unknown')} ({source.get('quotes', 0)} observed)")
          for warning in warnings:
              lines.append(f'- Warning: {warning}')
          result = '\n'.join(lines) + '\n'
          print(result)
          destination = os.environ.get('GITHUB_STEP_SUMMARY')
          if destination:
              with open(destination, 'a', encoding='utf-8') as handle:
                  handle.write(result)
          PY
