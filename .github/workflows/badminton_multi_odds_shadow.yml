name: Badminton multi-bookmaker odds observation (shadow)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/badminton_multi_odds_shadow.yml'
  schedule:
    - cron: '12 6,8,9 * * *'   # 08:12, 10:12, 11:12 Paris in summer; one hour earlier in winter

permissions:
  contents: write

concurrency:
  group: badminton-odds-shadow
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate multi-operator parsers
        run: |
          python -m py_compile multi_book_odds_scraper.py unibet_odds_scraper.py
          python unibet_odds_scraper.py --self-test
          python multi_book_odds_scraper.py --self-test
      - name: Install browser for public pages
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Read-only public prices and access diagnostics
        run: python multi_book_odds_scraper.py --live --out data/odds_shadow
      - name: Save evidence without changing model, historic predictions or T0
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/odds_shadow
          if ! git diff --cached --quiet; then
            git commit -m 'Audit public multi-bookmaker badminton H2H prices'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Report observed prices, not betting recommendations
        if: always()
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          f=Path('data/odds_shadow/latest_summary.json')
          d=json.loads(f.read_text(encoding='utf-8')) if f.exists() else {}
          lines=['### Badminton odds shadow audit',
            '- No betting, login, anti-bot bypass or T0/Sheets update.',
            '- Source timestamps are observation timestamps, NOT bookmaker update times.',
            f"- Online H2H candidates: {d.get('online_h2h_shadow_rows','n/a')}",
            f"- Retail FDJ candidates, not interchangeable with online: {d.get('retail_shadow_rows','n/a')}"]
          for key,v in d.get('sources',{}).items():
            lines.append(f"- {key}: {v['status']} ({v['quotes']} shadow quotes)")
          text='\n'.join(lines)+'\n'
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as out:out.write(text)
          PY
