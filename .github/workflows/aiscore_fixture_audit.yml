name: AiScore fixture coverage audit (manual, NO BET)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'aiscore_fixture_audit.py'
      - 'test_aiscore_fixture_audit.py'
      - '.github/workflows/aiscore_fixture_audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fixture identity and date handling offline
        run: python -m unittest -v test_aiscore_fixture_audit
      - name: Collect public fixtures and compare with the BWF checkout
        if: github.event_name == 'workflow_dispatch'
        run: python aiscore_fixture_audit.py --live --days 14 --out "$RUNNER_TEMP/aiscore-fixtures"
      - name: Preserve audit including partial or failed collection
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: aiscore-fixture-coverage-${{ github.run_id }}
          path: ${{ runner.temp }}/aiscore-fixtures/*.json
          if-no-files-found: error
          retention-days: 14
